name: carplay-ios
on:
  workflow_dispatch:
  push:
    branches: [carplay, ios-analytics, carplay-cpmaneuver, "carplay-sim-*"]
jobs:
  ios-sim:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        size: ["800x480@2", "1920x720@3", "748x456@2"]   # Apple's recommended CarPlay test sizes (standard, widescreen, minimum)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: python3 scripts/build_web.py && npm ci && npx cap sync ios
      # 1) Compile check exactly like a CI build with no Apple signing at all
      - name: Unsigned simulator build
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
      # 2) Ad-hoc ("Sign to Run Locally") build so the simulator sees the carplay-maps entitlement
      - name: Ad-hoc signed simulator build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build | tail -n 40
      - name: Run in simulator + screenshots (phone + CarPlay external display)
        continue-on-error: true
        env: {CARPLAY_SIZE: "${{ matrix.size }}", CARPLAY_TAPS: "200,250 97,212", DEMO_FROM: "33.1590,-117.3440", DEMO_TO: "33.1680,-117.3565,Carlsbad North Beach", DEMO_DRIVE: "0", OFFROUTE_TRACK: "33.1590,-117.3440 33.1592,-117.3400 33.1595,-117.3360"}
        run: bash scripts/ci_carplay_shots.sh
      # 3) Analytics hooks: if the CarPlay scene connected in the simulator run, its DEBUG log must show the hooks fired.
      - name: CarPlay analytics hooks fired (session on connect, route_started on Go)
        run: |
          L=shots-ci/app-log.txt; touch "$L"
          if ! grep -q "GCMCarPlay scene connected" "$L"; then echo "::warning::CarPlay scene did not connect in this run; hook check skipped"; exit 0; fi
          grep -E "GCMTrack (session|route_started|route_completed)" "$L" | tee shots-ci/analytics-hooks.txt
          grep -q "GCMTrack session ok" "$L" || { echo "::error::no 'GCMTrack session ok' after CarPlay connected"; exit 1; }
          grep -q "GCMTrack route_started ok" "$L" || echo "::warning::demo trip did not start guidance; route_started not seen"
      - name: Off-route reroute happened (log)
        run: |
          L=shots-ci/app-log.txt; touch "$L"
          grep -E "GCMCarPlay (layout|reroute|rerouted)" "$L" | tee shots-ci/reroute-log.txt || true
          grep -q "GCMCarPlay rerouted" "$L" || echo "::warning::no CarPlay reroute seen in this run"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "carplay-shots-${{ strategy.job-index }}", path: shots-ci/, if-no-files-found: warn}
