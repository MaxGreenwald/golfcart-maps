name: web-ci
# Fast checks for every push/PR. Never deploys anything.
on:
  push:
  pull_request:
jobs:
  data:
    name: unit tests + data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # tests/test_web_build.py replays a real missed cache bump from history
      - name: public/ is the only copy of the web app (no committed ios/android/dist bundles)
        run: python scripts/check_single_source.py
      - name: "scripts/test_*.py cannot print FAIL and still exit 0"
        run: python scripts/check_test_exit.py
      - name: No 'verified' claims outside the coastal-SD verified badge
        run: python scripts/check_verified_wording.py
      - name: Analytics schema / PII guard (node --test)
        run: node --test tests/analytics.test.mjs
      - name: Live town loader (native app prefers golfcartmap.com JSON; bundled fallback)
        run: node --test tests/livedata.test.mjs
      - name: CarPlay Experiences bridge (node --test)
        run: node --test tests/carplay_experiences.test.mjs
      - name: Partner owner-endpoint authz (super-admin any shop; owners only their own)
        run: node --test tests/partner_access.test.mjs
      - name: Partner places validation (category enum, no coupon, https link)
        run: node --test tests/partner_places.test.mjs
      - name: Shop rental vehicle (API values, worker stores and exposes it)
        run: node --test tests/partner_vehicle.test.mjs
      - name: Turn-by-turn maneuvers (turn side, distance, off route, arrival)
        run: node --test tests/nav.test.mjs
      - name: Live navigation (off-route timer, reroute debounce, heading)
        run: node --test tests/navfollow.test.mjs
      - name: Local-first search (bias, distance rerank, far label)
        run: node --test tests/geosearch.test.mjs
      - name: Saved places (Home, Favorite beach, favorites)
        run: node --test tests/places.test.mjs
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Unit tests (roundabout rule, validators, SW cache name, single source)
        run: python -m unittest discover -s tests -v
      - name: "Road rule unit tests (golf cart vs LSV; CA golf carts <=25, CVC 21716)"
        run: node scripts/test_roadrule.js && node scripts/test_range.js
      - name: "Local enforcement gate (every live region records its sheriff/police/city cart source check)"
        run: python scripts/check_enforcement.py
      - name: "Validate built region data (red islands / ring codes vs baseline; same-road islands vs research/red_island_allowlist.json)"
        run: python scripts/validate_data.py
  browser:
    name: browser tests (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      URL: http://localhost:8765/map/   # dist/: / is the landing page, the map is /map (scripts/serve_dist.py mimics Pages routing)
      SHOTS: ${{ github.workspace }}/ci-shots/
      SHOTS_DIR: ${{ github.workspace }}/ci-shots/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium webkit
      - name: Build dist/ (what gets deployed) and serve it
        run: |
          mkdir -p ci-shots
          python scripts/build_web.py
          (python scripts/serve_dist.py 8765 dist >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ >/dev/null && break; sleep 1; done
      - name: test_sw (stamped cache name, old caches dropped, works offline)
        run: python scripts/test_sw.py
        env: {URL: "http://localhost:8765/"}
      - name: "test_search_keep_text (typed destination text survives GPS ticks; Phoenix->Sun City and SD)"
        run: python -m unittest tests.test_search_keep_text -v
      - name: Local-first search + saved places (browser)
        run: python -m unittest tests.test_local_search_ui -v
      - name: test_ui
        run: python scripts/test_ui.py
      - name: test_verified ('verified' only on two-source coastal SD segments; other regions never)
        run: python scripts/test_verified.py
      - name: test_analytics (events, attribution, arrival, CarPlay hooks, GPC/DNT opt-out; local sink, nothing sent)
        run: python scripts/test_analytics.py
      - name: test_delmar_warning (Del Mar posted-limit warning shows until Nov 19 2026, then hides)
        run: python scripts/test_delmar_warning.py
      - name: "test_safety_caution (SD stretches where signs or OSM show a higher limit; dashed orange, popup, route steps)"
        run: python scripts/test_safety_caution.py
      - name: "test_islands_ui (same-road islands: Soledad Mtn Rd carriageway green; 'sources disagree' caution)"
        run: python scripts/test_islands_ui.py
      - name: "test_city_chip (city chip in the top row, A-Z, San Diego default, switching re-centers, back/forward)"
        run: python scripts/test_city_chip.py
      - name: "test_regions (saved choice, Villages routes, Greenwich within 50 mi, far-away defaults to San Diego)"
        run: python scripts/test_regions.py
      - name: test_chips
        run: python scripts/test_chips.py
      - name: test_layout
        run: python scripts/test_layout.py
      - name: test_chip_overflow (WebKit + iOS-style select padding, every region at 375/390/430)
        run: python scripts/test_chip_overflow.py
      - name: "test_vehicle (golf cart / LSV toggle, CA golf carts <=25)"
        run: python scripts/test_vehicle.py
      - name: "test_appstore (iOS build - no paywall, tip or beta labels; native share and haptics wired; launches with third-party hosts blocked)"
        run: python scripts/test_appstore.py
      - name: test_live_regions (app mode shows a town that exists only on the live origin)
        run: python scripts/test_live_regions.py
      - name: test_sv_label (Street View check photos labeled as Street View, not local report)
        run: python scripts/test_sv_label.py
      - name: test_trusted_osm_ui (trusted OSM 'o' draws like the OSM tag, labelled "OpenStreetMap, matches nearby sign", never verified)
        run: python scripts/test_trusted_osm_ui.py
      - name: test_partner_brand_color (color swatch, and drop-pin tiles centered on the city)
        run: python -m unittest tests.test_partner_brand_color -v
      - name: test_partner_experience_stops (edit a stop and reorder, then the save sticks)
        run: python -m unittest tests.test_partner_experience_stops -v
      - name: test_partner_super_edit (super-admin opens any shop's owner editor, banner, scoped calls, back)
        run: python -m unittest tests.test_partner_super_edit -v
      - name: test_partner_places (owner place CRUD, place as stop, renter icons + notes)
        run: python -m unittest tests.test_partner_places -v
      - name: test_partner_vehicle (admin saves vehicle; LSV shop draws 35 mph Grand Ave green, golf cart shop red)
        run: python -m unittest tests.test_partner_vehicle -v
      - name: test_turn_by_turn (renter banner follows GPS, step list, mute, reroute, arrival; picked ride folds the others away)
        run: python -m unittest tests.test_turn_by_turn -v
      - name: Live navigation (Start, follow, Recenter, reroute, pinch/pan preview)
        run: python -m unittest tests.test_live_nav -v
      - name: Nav start (heading-up at Start standing still, Start not paused, photo icon in nav; Chromium + WebKit)
        run: python -m unittest tests.test_nav_start -v
      - name: Map icon setting (Settings > Your map icon)
        run: python -m unittest tests.test_map_icon -v
      - name: "test_foldable (iPhone Duo folded/unfolded sizes; fold and unfold mid-navigation keeps the route and follow)"
        run: python -m unittest tests.test_foldable -v
      - name: "test_partner_latest_map (renter/partner pages skip cached map data; offline shows 'map may be outdated')"
        run: python -m unittest tests.test_partner_latest_map -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: ci-shots, path: ci-shots, if-no-files-found: ignore}
  # Push events have no pull request body. pull_request payloads do.
  pr-body:
    name: PR body has Summary, Evidence, and Merge danger
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PR body for Summary, Evidence, and Merge danger
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_pr_body.py
