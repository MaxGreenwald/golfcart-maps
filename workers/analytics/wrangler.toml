# Anonymous usage analytics for Golf Cart Map (see lib/analytics.js for the event allowlist).
#   preview:    scripts/deploy_worker.sh preview analytics
#   production: scripts/deploy_worker.sh production analytics --max-ok <Max chat or card id>
#               (gcm-analytics, used by golfcartmap.com; the script refuses without the ref)
# STATS_KEY is a secret: wrangler secret put STATS_KEY [--env preview]
name = "gcm-analytics"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = true

[[durable_objects.bindings]]
name = "EVENTS"
class_name = "Events"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Events"]

[env.preview]
name = "gcm-analytics-preview"
[[env.preview.durable_objects.bindings]]
name = "EVENTS"
class_name = "Events"
