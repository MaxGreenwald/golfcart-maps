# Anonymous usage analytics for Golf Cart Maps (see lib/analytics.js for the event allowlist).
#   preview:    wrangler deploy --env preview   -> gcm-analytics-preview (used by *.golfcart-maps.pages.dev)
#   production: wrangler deploy                 -> gcm-analytics (used by golfcartmap.com; only with Max's OK)
# STATS_KEY is a secret: wrangler secret put STATS_KEY [--env preview]
name = "gcm-analytics"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = true

[[durable_objects.bindings]]
name = "EVENTS"
class_name = "Events"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Events"]

[env.preview]
name = "gcm-analytics-preview"
[[env.preview.durable_objects.bindings]]
name = "EVENTS"
class_name = "Events"
